; =====================================================================
; CONFIGURACIÓN DE web_scrapping
;
; Las líneas que empiezan por ";" son comentarios.
; Valores sí/no: true / false. Listas: separadas por comas.
;
; =====================================================================

[claves]
; Apify (TikTok, Facebook, Instagram, X, Google Reviews, Trustpilot)
; https://console.apify.com/settings/integrations
apify_token =
; OpenAI (para clasificar sentimiento y categoría)
; https://platform.openai.com/api-keys
openai_api_key =
; Google Cloud con "YouTube Data API v3" activada (gratis: 10.000 unidades al día)
; https://console.cloud.google.com/apis/credentials
youtube_api_key =

[general]
; Minutos máximos que puede durar una ejecución de un actor de Apify
tiempo_maximo_min = 60
; true  = cada extracción nueva se AÑADE al json de la red (sin duplicados)
; false = cada extracción REEMPLAZA el json anterior
acumular = true


[tiktok]
; Actor: thescrapelab/tiktok-comments-scraper
; Precio: $0.25 / 1.000 comentarios + $0.005 por vídeo (+ uso de plataforma)
; Con $1 ≈ 3.000 comentarios
actor = thescrapelab/tiktok-comments-scraper
max_gasto_usd = 1.00
; Comentarios principales por vídeo (1 - 10000)
comentarios_por_video = 1000
; Respuestas a comentarios: cada una se cobra igual que un comentario
incluir_respuestas = false
respuestas_por_comentario = 3
; Segundos máximos por vídeo. Con poco tiempo el actor no llega a descargar nada.
; Calcula ~300 s por cada 2.000 comentarios.
segundos_por_video = 300
; Proxy residencial: más caro; actívalo solo si algún vídeo falla por bloqueo
proxy_residencial = false
precio_1000 = 0.25


[facebook]
; Actor: memo23/facebook-comments-scraper  ($0.50 / 1.000 comentarios + pequeña tarifa por ejecución)
actor = memo23/facebook-comments-scraper
max_gasto_usd = 1.00
; Comentarios por publicación
comentarios_por_post = 1000
; ALL (todos), NEWEST (más recientes) o MOST_RELEVANT
orden = ALL
; Respuestas a comentarios (cada respuesta cuenta como resultado)
incluir_respuestas = false
precio_1000 = 0.50


[instagram]
; Actor: apify/instagram-comment-scraper  ($2.30 / 1.000: la red más cara)
; Instagram solo muestra sin login una parte de los comentarios de cada post.
actor = apify/instagram-comment-scraper
max_gasto_usd = 1.00
comentarios_por_post = 500
; Respuestas: el actor solo lo permite en planes de pago
incluir_respuestas = false
precio_1000 = 2.30


[x]
; Actor: xquik/x-reply-scraper  ($0.15 / 1.000 respuestas, mismo precio en plan gratuito)
actor = xquik/x-reply-scraper
max_gasto_usd = 0.50
; Respuestas máximas por tuit
respuestas_por_tuit = 1000
; direct = respuestas directas al tuit · nested = respuestas a respuestas · all = ambas
alcance = all
; Profundidad máxima de respuestas anidadas (solo con nested / all)
profundidad = 3
; latest, relevance, oldest o likes
orden = latest
; Excluir las respuestas del propio autor del tuit (la marca respondiendo)
excluir_autor_original = true
; Incluir respuestas que X oculta ("respuestas adicionales")
incluir_ocultas = true
; Filtros opcionales (vacío = sin filtro). Fechas: AAAA-MM-DD
idioma =
desde =
hasta =
min_likes =
precio_1000 = 0.15


[youtube]
; API oficial de Google: no usa Apify ni cuesta dinero.
; Cuota gratuita: 10.000 unidades/día; cada página de 100 comentarios gasta 1 unidad.
comentarios_por_video = 5000
; Respuestas a cada comentario (gastan cuota extra en hilos con más de 5 respuestas)
incluir_respuestas = true
; time (más recientes) o relevance
orden = time


[google_reviews]
; Actor: compass/google-maps-reviews-scraper  ($0.60 / 1.000 en plan gratuito)
actor = compass/google-maps-reviews-scraper
max_gasto_usd = 0.75
; Reseñas máximas por lugar
resenas_por_lugar = 1000
; newest, mostRelevant, highestRanking o lowestRanking
orden = newest
; Idioma en que Google devuelve los textos (es, en, pt-BR…)
idioma = es
; Solo reseñas desde esta fecha (AAAA-MM-DD o "30 days"); requiere orden = newest
desde =
; Solo reseñas que contengan este texto
filtro_texto =
; all (Google + otras webs) o google
origen = all
; Nombre del autor y enlace a la reseña
datos_personales = false
precio_1000 = 0.60


[trustpilot]
; Actor: sourabhbgp/trustpilot-review-scraper  ($0.50 / 1.000 + $0.007 por ejecución)
; Sin límite por ejecución en plan gratuito; hasta ~5.000 reseñas por empresa.
actor = sourabhbgp/trustpilot-review-scraper
max_gasto_usd = 0.75
resenas_por_empresa = 5000
; recency = más recientes primero
orden = recency
; Filtro de estrellas, p. ej. 1,2 (vacío = todas)
estrellas =
; Idiomas, p. ej. es,en (vacío = todos)
idiomas =
; Desde fecha AAAA-MM-DD (vacío = todas)
desde =
solo_verificadas = false
solo_con_respuesta = false
palabra_clave =
; true = una ejecución por cada nivel de estrellas (1★, 2★… 5★).
; Úsalo si una empresa tiene más reseñas de las que el actor saca en una sola pasada.
dividir_por_estrellas = false
precio_1000 = 0.50
